{% extends "base.html" %}

{% block title %}Generate Campaign Poster — G-ONE 2027{% endblock %}

{% block content %}
<section class="py-8 px-4 sm:py-12 sm:px-6 lg:px-12 max-w-7xl mx-auto">
  <div class="grid gap-8 lg:grid-cols-2 lg:gap-12 items-start">
    
    <!-- Left Column: Controls & Photo Upload (on mobile order-2, on desktop order-1) -->
    <div class="order-2 lg:order-1 space-y-6 sm:space-y-8">
      
      <!-- Big Photo Upload Dropzone -->
      <div class="space-y-4">
        <!-- Dropzone before image upload -->
        <div id="dropzone">
          <input id="photo-input" type="file" accept="image/*" class="hidden">
          <label for="photo-input" class="flex w-full cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-gray-300 bg-gray-50/50 px-6 py-10 text-center transition-all hover:border-primary hover:bg-emerald-50/30 group sm:aspect-square sm:rounded-3xl sm:py-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-plus mb-4 h-10 w-10 text-primary group-hover:scale-110 transition-transform sm:mb-5 sm:h-14 sm:w-14"><path d="M16 5h6"></path><path d="M19 2v6"></path><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"></path><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path><circle cx="9" cy="9" r="2"></circle></svg>
            <h3 class="text-lg font-semibold text-gray-900 sm:text-xl">Upload Your Image</h3>
            <p class="mt-1.5 text-sm text-gray-500">Click to browse your gallery</p>
            <p class="mt-1 text-xs text-gray-400">JPG or PNG · Max 10 MB</p>
          </label>
        </div>

        <!-- Cropper Workspace (Shown once photo is selected) -->
        <div id="cropper-wrapper" class="hidden space-y-4 rounded-2xl border border-gray-200 bg-gray-50/50 p-4 shadow-sm sm:rounded-3xl sm:p-6">
          <div class="relative aspect-square max-h-[300px] w-full overflow-hidden rounded-xl bg-black sm:max-h-[380px] sm:rounded-2xl">
            <img id="cropper-img" src="" alt="Supporter Upload" class="max-w-full">
          </div>

          <!-- Cropper Controls -->
          <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
            <div class="flex items-center gap-2">
              <button type="button" id="btn-zoom-in" class="rounded-xl border border-gray-200 bg-white p-2.5 text-gray-700 hover:bg-gray-100 shadow-sm" title="Zoom In">
                <i data-lucide="zoom-in" class="h-4 w-4"></i>
              </button>
              <button type="button" id="btn-zoom-out" class="rounded-xl border border-gray-200 bg-white p-2.5 text-gray-700 hover:bg-gray-100 shadow-sm" title="Zoom Out">
                <i data-lucide="zoom-out" class="h-4 w-4"></i>
              </button>
              <button type="button" id="btn-rotate" class="rounded-xl border border-gray-200 bg-white p-2.5 text-gray-700 hover:bg-gray-100 shadow-sm" title="Rotate">
                <i data-lucide="rotate-cw" class="h-4 w-4"></i>
              </button>
              <button type="button" id="btn-reset" class="rounded-xl border border-gray-200 bg-white p-2.5 text-gray-700 hover:bg-gray-100 shadow-sm" title="Reset">
                <i data-lucide="refresh-cw" class="h-4 w-4"></i>
              </button>
            </div>

            <label class="inline-flex items-center gap-1.5 rounded-xl border border-gray-200 bg-white px-3.5 py-2 text-xs font-bold text-gray-700 hover:bg-gray-100 shadow-sm cursor-pointer">
              <i data-lucide="upload" class="h-3.5 w-3.5 text-primary"></i>
              <span>Change Photo</span>
              <input type="file" id="change-photo-input" accept="image/*" class="hidden">
            </label>
          </div>
        </div>
      </div>

      <!-- Form Details -->
      <form class="space-y-5 sm:space-y-6" onsubmit="return false;">
        <!-- Local Government Area -->
        <div class="space-y-2">
          <label for="lga" class="text-sm font-medium text-gray-700">Local Government</label>
          <select id="lga" name="lga" class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
            <option value="">Select Local Government</option>
            <option value="Ankpa">Ankpa</option>
            <option value="Omala">Omala</option>
            <option value="Olamaboro">Olamaboro</option>
          </select>
        </div>

        <!-- Ward (Optional) -->
        <div class="space-y-2">
          <label for="ward" class="text-sm font-medium text-gray-700">Ward (Optional)</label>
          <input id="ward" name="ward" placeholder="Enter your ward" class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
        </div>

        <!-- Full Name -->
        <div class="space-y-2">
          <label for="supporter-name" class="text-sm font-medium text-gray-700">Full Name</label>
          <input id="supporter-name" name="name" placeholder="Enter your full name" class="flex h-11 w-full rounded-md border border-gray-300 bg-white px-3 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
        </div>

        <!-- Submit Button -->
        <button type="button" id="btn-generate-poster" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-primary px-4 py-3 text-sm font-medium text-white shadow hover:bg-emerald-700 transition w-full disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="btn-generate-text">Generate &amp; Download</span>
        </button>
        
        <p id="error-message" class="text-xs text-red-600 font-bold text-center hidden"></p>
      </form>

    </div>

    <!-- Right Column: Live Sticky Frame Preview (Exact Wadada order-1 lg:order-2) -->
    <div class="order-1 lg:order-2">
      <div class="sticky top-24">
        <div class="relative aspect-square overflow-hidden rounded-2xl border bg-gray-50 shadow-lg sm:rounded-3xl sm:shadow-xl">
          <!-- Cutout User Photo Layer -->
          <div id="preview-user-box" class="absolute z-0 overflow-hidden" style="top: 26.07%; left: 50.88%; width: 42.48%; height: 42.0%; border-radius: 1.75rem;">
            <img id="preview-user-img" src="/static/gone_hero.jpg" alt="Preview Photo" class="h-full w-full object-cover">
          </div>

          <!-- Official Campaign Frame Overlay (Transparent Cutout) -->
          <img alt="Frame" class="pointer-events-none absolute inset-0 h-full w-full object-cover z-10" src="/static/gone_frame.png">
        </div>

        <div class="mt-3 text-center sm:mt-4">
          <p class="text-xs font-semibold text-gray-500">
            Live Preview · Prince Gowon Enenche (G-ONE) · SDP
          </p>
        </div>
      </div>
    </div>

  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  const photoInput = document.getElementById('photo-input');
  const changePhotoInput = document.getElementById('change-photo-input');
  const dropzone = document.getElementById('dropzone');
  const cropperWrapper = document.getElementById('cropper-wrapper');
  const cropperImg = document.getElementById('cropper-img');
  const previewUserImg = document.getElementById('preview-user-img');
  const lgaSelect = document.getElementById('lga');
  const wardInput = document.getElementById('ward');
  const nameInput = document.getElementById('supporter-name');
  const btnGenerate = document.getElementById('btn-generate-poster');
  const btnGenerateText = document.getElementById('btn-generate-text');
  const errorMessage = document.getElementById('error-message');

  let cropper = null;

  function handleImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      cropperImg.src = e.target.result;
      dropzone.classList.add('hidden');
      cropperWrapper.classList.remove('hidden');

      if (cropper) {
        cropper.destroy();
      }

      cropper = new Cropper(cropperImg, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 0.9,
        background: false,
        ready() {
          updateLivePreview();
        },
        crop() {
          updateLivePreview();
        }
      });
    };
    reader.readAsDataURL(file);
  }

  photoInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      handleImageFile(e.target.files[0]);
    }
  });

  changePhotoInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      handleImageFile(e.target.files[0]);
    }
  });

  function updateLivePreview() {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ width: 435, height: 430 });
    if (canvas) {
      previewUserImg.src = canvas.toDataURL('image/png');
    }
  }

  document.getElementById('btn-zoom-in').addEventListener('click', () => cropper && cropper.zoom(0.1));
  document.getElementById('btn-zoom-out').addEventListener('click', () => cropper && cropper.zoom(-0.1));
  document.getElementById('btn-rotate').addEventListener('click', () => cropper && cropper.rotate(90));
  document.getElementById('btn-reset').addEventListener('click', () => cropper && cropper.reset());

  btnGenerate.addEventListener('click', async () => {
    errorMessage.classList.add('hidden');
    const name = nameInput.value.trim() || 'Constituent Supporter';
    const lga = lgaSelect.value || 'Ankpa';
    const ward = wardInput.value.trim() || 'Township';

    let croppedDataUrl = null;
    if (cropper) {
      const croppedCanvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
      croppedDataUrl = croppedCanvas.toDataURL('image/png');
    } else {
      croppedDataUrl = previewUserImg.src;
    }

    btnGenerate.disabled = true;
    btnGenerateText.textContent = 'Rendering High-Res Poster...';

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          lga: lga,
          ward: ward,
          image_data: croppedDataUrl,
        }),
      });

      const res = await response.json();
      if (!res.success) {
        throw new Error(res.error || 'Failed to generate poster');
      }

      if (window.confetti) {
        confetti({
          particleCount: 90,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      // Download trigger
      const downloadLink = document.createElement('a');
      downloadLink.href = res.poster_url;
      downloadLink.download = `G-ONE-Campaign-Poster-${lga}.png`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      setTimeout(() => {
        window.location.href = `/generate/success?uid=${res.uid}&poster=${encodeURIComponent(res.poster_url)}`;
      }, 700);

    } catch (err) {
      console.error(err);
      errorMessage.textContent = err.message || 'An error occurred during poster generation.';
      errorMessage.classList.remove('hidden');
      btnGenerate.disabled = false;
      btnGenerateText.textContent = 'Generate & Download';
    }
  });
</script>
{% endblock %}
